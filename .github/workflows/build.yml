name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This package uses cgo (it exports a C ABI), so vet/test/build all need a
      # C compiler. Linux and macOS runners ship one; the Windows image does not.
      - name: setup mingw (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: point CC at mingw (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV

      - name: gofmt
        shell: bash
        run: |
          # .gitattributes pins eol=lf so this is meaningful on Windows too.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: build (c-shared)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) ext=dll ;;
            macOS)   ext=dylib ;;
            *)       ext=so ;;
          esac
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "opencodehub.$ext" .
          ls -l "opencodehub.$ext"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencodehub-${{ runner.os }}
          path: |
            opencodehub.dll
            opencodehub.so
            opencodehub.dylib
          if-no-files-found: ignore
